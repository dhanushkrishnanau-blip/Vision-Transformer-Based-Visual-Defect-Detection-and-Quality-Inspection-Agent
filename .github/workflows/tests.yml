name: Project 12 Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest
          fastapi
          httpx
          requests
          python-dotenv
          langgraph
          streamlit

      - name: Run test suite
        run: python -m pytest tests/ -v
        env:
          DASHBOARD_OFFLINE: "1"
